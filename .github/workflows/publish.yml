# GitHub でリリース(タグ v0.1.0 など)を公開すると、テストしてから PyPI に公開する。
# PyPI 側で「Trusted Publisher」(このリポジトリ・publish.yml・環境 pypi)の登録が必要。
# トークンは使わない(GitHub の OIDC で PyPI に認証する)。
name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest
          python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        run: |
          VERSION=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('gagaku/__init__.py', encoding='utf-8').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package version: $VERSION / tag: $TAG"
          test "$VERSION" = "$TAG"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gagaku-player
    permissions:
      id-token: write   # Trusted Publishing に必要
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
